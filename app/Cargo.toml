[package]
name = "midifighter-keymapper-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Tauri desktop editor GUI for the Midi Fighter key-mapper."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midifighter-keymapper-core = { path = "../core" }
midifighter-keymapper-engine = { path = "../engine" }

[[bin]]
name = "midifighter-keymapper"
path = "src/main.rs"
