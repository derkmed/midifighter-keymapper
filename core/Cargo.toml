[package]
name = "midifighter-keymapper-core"
version = "0.1.0"
edition = "2021"
description = "Pure logic core for the Midi Fighter 3D key-mapper: MIDI codec, config, action planner."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"

[dev-dependencies]
tempfile = "3"
